<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic POS System</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    .container { display: flex; gap: 40px; }
    .panel { flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    
    h2 { border-bottom: 2px solid #333; padding-bottom: 5px; }
    .menu-item { margin: 10px 0; padding: 10px; border: 1px solid #eee; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; }
    select, input { padding: 8px; width: 100%; margin-top: 5px; }
    
    .btn { cursor: pointer; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; }
    .btn-add { background: #e0e0e0; width: 100%; }
    .btn-pay { background: #4CAF50; color: white; margin-top: 10px; }
    
    .order-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 5px 0; }
    .total-box { font-size: 1.2rem; font-weight: bold; margin: 20px 0; padding: 10px; background: #f9f9f9; }
    .receipt { background: #fffde7; border: 1px dashed #000; padding: 15px; margin-top: 20px; display: none; }
  </style>
</head>
<body>

<h1>POS Terminal</h1>

<div class="container">
  <div class="panel">
    <h2>Menu & Selection</h2>
    
    <div class="form-group">
      <label>Select Item</label>
      <select id="itemSelect"></select>
    </div>
    
    <div class="form-group">
      <label>Quantity</label>
      <input type="number" id="itemQty" value="1" min="1">
    </div>
    
    <button class="btn btn-add" onclick="addToOrder()">Add to Cart</button>

    <div style="margin-top: 30px;">
      <h3>Price List</h3>
      <div id="priceList"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Current Order</h2>
    <div id="orderList">
      <p>Cart is empty</p>
    </div>

    <div class="total-box">
      Total: ₱<span id="totalDisplay">0</span>
    </div>

    <div class="form-group">
      <label>Cash Received</label>
      <input type="number" id="cashInput" placeholder="0.00">
      <button class="btn btn-pay" onclick="processPayment()">Complete Sale</button>
    </div>

    <div id="receipt" class="receipt">
      <strong>Transaction Complete</strong>
      <p id="receiptDetails"></p>
      <button onclick="document.getElementById('receipt').style.display='none'">Close</button>
    </div>
  </div>
</div>

<script>
  const menu = {
    "Burger": 60,
    "Fries": 50,
    "Fishball": 20,
    "Kikiam": 25
  };

  let cart = [];

  function init() {
    const select = document.getElementById('itemSelect');
    const priceList = document.getElementById('priceList');
    
    for (const [name, price] of Object.entries(menu)) {
      // Fill Dropdown
      let opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);

      // Fill Price List
      priceList.innerHTML += `<div>${name}: ₱${price}</div>`;
    }
  }

  function addToOrder() {
    const name = document.getElementById('itemSelect').value;
    const qty = parseInt(document.getElementById('itemQty').value);

    if (qty < 1) return;

    const existing = cart.find(i => i.name === name);
    if (existing) {
      existing.qty += qty;
    } else {
      cart.push({ name, qty, price: menu[name] });
    }
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById('orderList');
    const display = document.getElementById('totalDisplay');
    
    if (cart.length === 0) {
      list.innerHTML = "<p>Cart is empty</p>";
      display.textContent = "0";
      return;
    }

    list.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
      const subtotal = item.qty * item.price;
      total += subtotal;
      list.innerHTML += `
        <div class="order-row">
          <span>${item.name} (x${item.qty})</span>
          <span>₱${subtotal} <button onclick="removeItem(${index})">x</button></span>
        </div>`;
    });

    display.textContent = total;
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function processPayment() {
    const total = parseInt(document.getElementById('totalDisplay').textContent);
    const cash = parseFloat(document.getElementById('cashInput').value);

    if (cart.length === 0) return alert("Cart is empty");
    if (isNaN(cash) || cash < total) return alert("Insufficient cash");

    const change = cash - total;
    const receipt = document.getElementById('receipt');
    const details = document.getElementById('receiptDetails');

    details.innerHTML = `Total: ₱${total}<br>Cash: ₱${cash}<br><strong>Change: ₱${change}</strong>`;
    receipt.style.display = 'block';

    // Reset
    cart = [];
    document.getElementById('cashInput').value = "";
    renderCart();
  }

  init();
</script>

</body>
</html>
