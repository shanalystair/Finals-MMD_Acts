<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Inventory System</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    h1 { text-align: center; color: #2c3e50; }
    
    .input-section { display: flex; gap: 10px; margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
    
    button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; }
    .btn-add { background: #27ae60; color: white; }
    .btn-del { background: #e74c3c; color: white; padding: 4px 8px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #34495e; color: white; }

    .stats { display: flex; justify-content: space-around; margin-bottom: 20px; font-weight: bold; }
    .stat-item { text-align: center; }

    /* Style for the inline edit input */
    .edit-input { width: 60px; padding: 4px; }
    .editable-qty { cursor: pointer; color: #2980b9; font-weight: bold; }
    .editable-qty:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h1>Inventory</h1>

  <div class="stats">
    <div class="stat-item">Items: <span id="totalItems">0</span></div>
    <div class="stat-item">Total Qty: <span id="totalQty">0</span></div>
  </div>

  <div class="input-section">
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="itemQty" placeholder="Qty" style="width: 80px;">
    <button class="btn-add" onclick="addItem()">Add</button>
  </div>

  <table id="inventoryTable">
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Quantity</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      </tbody>
  </table>
</div>

<script>
  let inventory = [];

  function addItem() {
    const nameInput = document.getElementById('itemName');
    const qtyInput = document.getElementById('itemQty');
    
    const name = nameInput.value.trim();
    const qty = parseInt(qtyInput.value);

    if (name === "" || isNaN(qty)) {
      alert("Please enter both a name and a number");
      return;
    }

    inventory.push({ name, qty });
    
    nameInput.value = "";
    qtyInput.value = "";
    
    render();
  }

  function deleteItem(index) {
    inventory.splice(index, 1);
    render();
  }

  // New function to handle the double-click transformation
  function editQty(index, cell) {
    const currentQty = inventory[index].qty;
    
    // Replace cell content with an input
    cell.innerHTML = `<input type="number" class="edit-input" id="edit-input-${index}" value="${currentQty}">`;
    
    const input = document.getElementById(`edit-input-${index}`);
    input.focus();

    // Save on Enter key
    input.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        saveQty(index, input.value);
      }
    });

    // Save on clicking away
    input.addEventListener('blur', () => {
      saveQty(index, input.value);
    });
  }

  function saveQty(index, newValue) {
    const parsedValue = parseInt(newValue);
    if (!isNaN(parsedValue) && parsedValue >= 0) {
      inventory[index].qty = parsedValue;
    }
    render();
  }

  function render() {
    const tbody = document.getElementById('tableBody');
    const totalItems = document.getElementById('totalItems');
    const totalQty = document.getElementById('totalQty');
    
    tbody.innerHTML = "";
    let sumQty = 0;

    inventory.forEach((item, index) => {
      sumQty += item.qty;
      
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${item.name}</td>
        <td class="editable-qty" ondblclick="editQty(${index}, this)">${item.qty}</td>
        <td><button class="btn-del" onclick="deleteItem(${index})">Remove</button></td>
      `;
      tbody.appendChild(row);
    });

    totalItems.textContent = inventory.length;
    totalQty.textContent = sumQty;
  }
</script>

</body>
</html>
